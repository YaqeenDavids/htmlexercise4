<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration and Search Form</title>
</head>
<body>

    <h2>User Information Form</h2>

    <form method="POST" action="https://lifechoices.co.za">

        <label for="first_name">First Name:</label><br>
        <input type="text" id="first_name" name="first_name" required><br><br>

        <label for="last_name">Last Name:</label><br>
        <input type="text" id="last_name" name="last_name" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        <label for="date_of_birth">Date of Birth:</label><br>
        <input type="date" id="date_of_birth" name="date_of_birth" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <input type="submit" value="Submit">
    </form>

    <hr>

    <h2>Search Form</h2>

    <form method="GET" action="LECTURER_URL_HERE">

        <label for="search_name">Search:</label><br>
        <input type="text" id="search_name" name="search_name"><br><br>

        <input type="submit" value="Search">
    </form>

</body>
</html>
